name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Preinstalled SDK_DIR=$SDK_DIR"
          ls -la "$SDK_DIR/platforms" 2>/dev/null || true

          if [ ! -d "$SDK_DIR/platforms/android-36" ]; then
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" 2>/dev/null || true
            fi

            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDKMANAGER" ]; then
              if [ -w "$SDK_DIR" ]; then
                (yes || true) | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
                "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
              else
                mkdir -p "$HOME/android-sdk"
                (yes || true) | "$SDKMANAGER" --sdk_root="$HOME/android-sdk" --licenses > /dev/null 2>&1 || true
                "$SDKMANAGER" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
                SDK_DIR="$HOME/android-sdk"
              fi
            fi
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-life-inventory-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
